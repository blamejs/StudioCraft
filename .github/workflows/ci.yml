name: CI

# Runs `cargo xtask ci`, and a check on the release build hosts, for every push to main and every
# pull request, through the suite's shared gate workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Pinned to craft-common-actions main at 2026-11-22T16:44Z; move the pin to take later changes.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8de74722ef8928135c7b6754124476bbec5a1c91
    with:
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev libpipewire-0.3-dev libclang-dev libgbm-dev libegl-dev

  # Checks that the app compiles on the hosts the release builds on (Windows and Ubuntu 22.04),
  # with the locked dependencies.
  release-hosts:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8de74722ef8928135c7b6754124476bbec5a1c91
    with:
      timeout-minutes: 60
      os: '["windows-latest"]'
      targets: ""
      tools: ""
      command: cargo check --locked -p studiocraft -p studiocraft-cli --bins

  # The shared gate needs Python 3.11 (tomllib), which Ubuntu 22.04 does not have, so this leg runs
  # here. It builds with the PipeWire headers packaging/linux/package.sh uses.
  release-host-linux:
    name: release-hosts / check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libasound2-dev \
            libpipewire-0.3-dev libclang-dev libgbm-dev libegl-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check
        run: |
          . packaging/linux/pipewire-headers.sh
          cargo check --locked -p studiocraft -p studiocraft-cli --bins
