# Flatpak manifest for the bundle attached to each GitHub release
# (studiocraft-<version>-linux-<arch>.flatpak), built by packaging/linux/flatpak-bundle.sh.
#
# It installs the binaries from the release's Linux tarball, which flatpak-bundle.sh unpacks into
# `stage/` beside a copy of this file, so the bundle holds the same binaries as the AppImage, deb
# and rpm. The freedesktop runtime provides glibc, X11, Wayland, xkbcommon, Vulkan, EGL, GBM,
# ALSA and PipeWire, and its GL extension provides the GPU driver.
#
# The runtime has no ffmpeg program, so recording and streaming need an ffmpeg that the sandbox
# can run; the other features work without one.
id: ai.storyteller.studiocraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: studiocraft
finish-args:
  # The updater reads and updates this installation through flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Wayland first, and X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory.
  - --share=ipc
  # Update checks and RTMP streams.
  - --share=network
  # The wgpu canvas and preview.
  - --device=dri
  # Camera sources open the V4L2 nodes in /dev.
  - --device=all
  # Audio input and desktop audio, through the PulseAudio socket that PipeWire also serves.
  - --socket=pulseaudio
  # Display and window capture on Wayland go through the screen-cast portal and PipeWire.
  - --filesystem=xdg-run/pipewire-0
  # Recordings go to the Videos folder by default.
  - --filesystem=xdg-videos
modules:
  - name: studiocraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/studiocraft /app/bin/studiocraft
      - install -Dm755 bin/studiocraft-cli /app/bin/studiocraft-cli
      - install -Dm644 share/applications/ai.storyteller.studiocraft.desktop /app/share/applications/ai.storyteller.studiocraft.desktop
      # package.sh has already written the version and date into it.
      - install -Dm644 share/metainfo/ai.storyteller.studiocraft.metainfo.xml /app/share/metainfo/ai.storyteller.studiocraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/studiocraft /app/share/doc/
    sources:
      - type: dir
        path: stage
