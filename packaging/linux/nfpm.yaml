# The .deb and .rpm packages, built by nfpm (https://nfpm.goreleaser.com). package.sh stages the
# file tree, writes its path in place of ${STAGE}, and exports VERSION and NFPM_ARCH.
name: studiocraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# With semver, 0.2.0-rc.1 becomes 0.2.0~rc.1, which sorts before 0.2.0.
version_schema: semver
release: 1
section: video
priority: optional
maintainer: ${STUDIOCRAFT_MAINTAINER}
homepage: https://github.com/blamejs/StudioCraft
license: MIT OR Apache-2.0
description: |-
  Open-source recording and live-streaming studio. Arrange displays,
  windows, pictures, text, media files and audio devices in scenes, switch
  scenes with transitions, mix the audio, and record to a file or stream to
  an RTMP server. Includes studiocraft-cli, a headless tool and MCP server.

# The app links glibc, libgcc_s, ALSA, PipeWire, GBM and EGL. The window system (X11 or Wayland,
# xkbcommon) and the GPU driver are loaded at run time. Recording and streaming run a separately
# installed ffmpeg.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libasound2 | libasound2t64
      - libpipewire-0.3-0 | libpipewire-0.3-0t64
      - libgbm1
      - libegl1
      - libxkbcommon0
    recommends:
      - ffmpeg
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - alsa-lib
      - pipewire-libs
      - mesa-libgbm
      - libglvnd-egl
      - libxkbcommon
    recommends:
      - ffmpeg
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/studiocraft
    dst: /usr/bin/studiocraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/studiocraft-cli
    dst: /usr/bin/studiocraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
