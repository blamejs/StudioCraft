[package]
name = "studiocraft-web"
description = "StudioCraft in the browser: an editor for scene collection files, built for WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "studiocraft-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
studiocraft-model = { workspace = true }
studiocraft-plugin = { workspace = true }
studiocraft-engine = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Node",
    "Url",
    "Window",
] }
