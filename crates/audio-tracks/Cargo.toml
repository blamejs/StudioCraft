[package]
name = "studiocraft-audio-tracks"
description = "StudioCraft audio tracks: each recorded source and the program mix written to its own WAV file on writer threads, with a journal, repair after a crash and a session file for the audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
studiocraft-model.workspace = true
studiocraft-media.workspace = true
craft-time.workspace = true
crossbeam-queue.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# The WAV header of 32-bit float files.
craft-audio = { workspace = true, features = ["pcm-encode"] }
# Free space on the disk the audio tracks are written to.
fs4.workspace = true
# The session file that opens a take's tracks in the audio editor, written in one step.
craft-scraft-format.workspace = true
craft-atomic.workspace = true

[target.'cfg(unix)'.dependencies]
# Opens the take's files without following a link.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Tells which file a name opens and how many names it has.
winapi-util.workspace = true

[dev-dependencies]
criterion.workspace = true
# Reads back what the writer wrote.
craft-audio = { workspace = true, features = ["pcm-encode", "decode-native"] }

[[bench]]
name = "collect"
harness = false

[[bench]]
name = "session"
harness = false

[lints]
workspace = true
