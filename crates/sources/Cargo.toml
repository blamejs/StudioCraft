[package]
name = "studiocraft-sources"
description = "Built-in sources and filters: color, image, text, media file, display and window capture, audio devices, application audio, live captions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
studiocraft-model.workspace = true
studiocraft-media.workspace = true
studiocraft-plugin.workspace = true
studiocraft-platform.workspace = true
craft-image-codecs.workspace = true
craft-font-catalog.workspace = true
craft-color-transform.workspace = true
craft-audio-dsp.workspace = true
craft-app-audio.workspace = true
# The speech model catalog the Live Captions source offers.
craft-speech.workspace = true
craft-audio = { workspace = true, features = ["vorbis-decode"] }
craft-media = { workspace = true, features = ["ogg"] }
ab_glyph.workspace = true
serde_json.workspace = true
log.workspace = true

[dev-dependencies]
craft-audio = { workspace = true, features = ["vorbis-encode"] }
craft-gpu-interop.workspace = true
craft-color.workspace = true
image.workspace = true
jpeg-encoder.workspace = true
studiocraft-render.workspace = true
criterion = { workspace = true }
stats_alloc = { workspace = true }

[[bench]]
name = "audio_feed"
harness = false

[[bench]]
name = "audio_filters"
harness = false

[lints]
workspace = true
