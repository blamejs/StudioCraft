[package]
name = "studiocraft-platform"
description = "Operating-system services: display, window, camera and audio capture, and finding ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
studiocraft-media.workspace = true
thiserror.workspace = true
# Frames from capture threads to the source thread.
crossbeam-queue.workspace = true
# The camera list the camera watch publishes, read without a lock.
arc-swap.workspace = true
zune-jpeg.workspace = true
# Display capture into textures shared with the compositor (Windows desktop duplication).
craft-gpu-interop.workspace = true

# Capture uses xcap (displays, windows) and cpal (audio devices, and output loopback through WASAPI
# on Windows). Linux captures through PipeWire. Other systems build without them and report capture
# as unavailable.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap.workspace = true
cpal.workspace = true

[target.'cfg(windows)'.dependencies]
nokhwa = { workspace = true, features = ["input-msmf"] }
comedy.workspace = true
# The device watcher that reports cameras plugged in or out, and the container ids that tie a
# camera to its microphone.
windows = { version = "0.62", features = ["Devices_Enumeration", "Foundation", "Foundation_Collections"] }
# The list of device properties the watcher is asked for.
windows-collections = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["input-avfoundation"] }
nokhwa-bindings-macos.workspace = true

# PipeWire's registry, metadata and streams; serde_json reads the default-device metadata. Displays
# and windows come from the screen-cast portal (ashpd, run by pollster on the capture thread) as
# PipeWire streams, handed to the source thread through crossbeam queues. Cameras go through V4L2.
# The display list comes from Wayland's outputs (wayland-client) or RandR under X11 (x11rb).
[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
serde_json.workspace = true
ashpd.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
pollster.workspace = true
nokhwa = { workspace = true, features = ["input-v4l"] }
v4l.workspace = true
# inotify on /dev, which reports V4L2 nodes plugged in or out.
rustix = { workspace = true, features = ["fs"] }
wayland-client.workspace = true
x11rb.workspace = true

[dev-dependencies]
serde_json.workspace = true
jpeg-encoder.workspace = true

[lints]
workspace = true
