[package]
name = "studiocraft-outputs"
description = "Recording through an ffmpeg process with the video encoders it offers, Matroska recording through the built-in encoders, and streaming through the built-in encoders to several RTMP and RTMPS destinations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
studiocraft-model.workspace = true
studiocraft-media.workspace = true
studiocraft-plugin.workspace = true
studiocraft-platform.workspace = true
studiocraft-encode.workspace = true
craft-hwenc.workspace = true
craft-media = { workspace = true, features = ["matroska"] }
craft-flv.workspace = true
craft-packet.workspace = true
craft-rtmp.workspace = true
crossbeam-queue.workspace = true
log.workspace = true
portable-atomic.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Independent decoders read back what a built-in recording writes.
craft-video = { workspace = true, features = ["h264-decode"] }
craft-audio = { workspace = true, features = ["aac-decode"] }

[lints]
workspace = true
