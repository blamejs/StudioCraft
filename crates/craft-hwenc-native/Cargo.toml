[package]
name = "craft-hwenc-native"
description = "Hardware video encoders called through the drivers' own APIs: NVENC H.264 and HEVC from NV12 or P010 frames, with the avcC and hvcC records built from the parameter sets the encoder writes"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# One of the crates `cargo xtask unsafe` lets opt in to unsafe code (AGENTS.md 0.3): only the
# `nvenc_ffi` module allows it, and every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

# Windows: the encoder runs on a Direct3D 11 device of the NVIDIA adapter, and the driver's
# `nvEncodeAPI64.dll` is loaded from the system directory.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

# 64-bit Linux: `libnvidia-encode.so.1` and `libcuda.so.1` are loaded at run time, so building
# needs no NVIDIA headers or libraries.
[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
libloading = "0.8"
log.workspace = true
