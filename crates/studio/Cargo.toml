[package]
name = "studiocraft-studio"
description = "The running studio: sources, mixer, compositor, transitions, recording, streaming and live captions behind one command interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
studiocraft-model.workspace = true
studiocraft-media.workspace = true
studiocraft-plugin.workspace = true
studiocraft-engine.workspace = true
studiocraft-render.workspace = true
studiocraft-platform.workspace = true
studiocraft-sources.workspace = true
craft-hwenc.workspace = true
studiocraft-outputs.workspace = true
# Each recorded source and the program mix written to its own WAV file.
studiocraft-audio-tracks.workspace = true
# The built-in NVENC encoders, tested in this process for MKV recordings.
studiocraft-encode.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
dirs.workspace = true
# Scene collection files are replaced in one step.
craft-atomic.workspace = true
# Still captures for render previews, encoded as PNG.
image.workspace = true
# Live captions: speech recognition of the program audio, and the downloads of its models.
craft-speech = { workspace = true, features = ["whisper", "download"] }
# The face tracking model catalog and its install; the download goes through craft-speech's
# checked downloader.
craft-face-track.workspace = true
# Caption files written beside a recording.
craft-captions.workspace = true
# The state of a stream's copy, handed from the thread that stops the stream.
crossbeam-queue.workspace = true

[dev-dependencies]
# The noop backend opens devices without a GPU in the device-loss tests.
wgpu = { workspace = true, features = ["noop"] }
tempfile.workspace = true

[lints]
workspace = true
