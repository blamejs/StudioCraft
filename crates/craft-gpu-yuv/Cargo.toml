[package]
name = "craft-gpu-yuv"
description = "RGBA to NV12, P010 and I420 on the GPU with scaling, in BT.601, BT.709 and BT.2020 at limited or full range, with a CPU reference of the same conversion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
wgpu = "30"

[dev-dependencies]
pollster = "0.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "convert"
harness = false
