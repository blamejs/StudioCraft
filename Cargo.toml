[workspace]
resolver = "3"
members = [".", "crates/*", "apps/*", "xtask"]
# `cargo build` and `cargo run` at the root build the desktop app and the libraries; `cargo xtask ci`
# covers the whole workspace with `--workspace`.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
craft-ease = { path = "crates/craft-ease" }
studiocraft-model = { path = "crates/model" }
studiocraft-media = { path = "crates/media" }
studiocraft-plugin = { path = "crates/plugin" }
studiocraft-engine = { path = "crates/engine" }
studiocraft-render = { path = "crates/render" }
studiocraft-platform = { path = "crates/platform" }
studiocraft-encode = { path = "crates/encode" }
studiocraft-sources = { path = "crates/sources" }
studiocraft-outputs = { path = "crates/outputs" }
studiocraft-audio-tracks = { path = "crates/audio-tracks" }
studiocraft-studio = { path = "crates/studio" }
studiocraft-ui-egui = { path = "crates/ui-egui" }
studiocraft-mcp = { path = "crates/mcp" }
# Shared crates built here before they move to craft-libs.
craft-scopes = { path = "crates/craft-scopes" }
craft-gpu-device = { path = "crates/craft-gpu-device" }
craft-gpu-yuv = { path = "crates/craft-gpu-yuv" }
craft-hwenc = { path = "crates/craft-hwenc" }
craft-hwenc-native = { path = "crates/craft-hwenc-native" }
craft-gpu-interop = { path = "crates/craft-gpu-interop" }
craft-app-audio = { path = "crates/craft-app-audio" }
craft-transitions = { path = "crates/craft-transitions" }
craft-flv = { path = "crates/craft-flv" }
craft-packet = { path = "crates/craft-packet" }
craft-rtmp = { path = "crates/craft-rtmp" }
craft-speech = { path = "crates/craft-speech" }
craft-face-track = { path = "crates/craft-face-track" }
craft-closed-captions = { path = "crates/craft-closed-captions" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# Pictures in control replies.
base64 = "0.22"
# Bounded lock-free queues between the capture, compositor, mixer and encoder threads.
crossbeam-queue = "0.3"
# Cache-line padding for counters that two threads write.
crossbeam-utils = "0.8"
# The subscriber list a packet fan-out reads without a lock.
arc-swap = "1"
# Tests and benches only: a global allocator that counts allocations.
stats_alloc = "0.1"
# RTMPS: TLS with the ring provider, and the system's certificate checks.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Tests only: key pairs and signatures for the loopback RTMPS server's certificates.
ring = "0.17"
# A 128-bit atomic for the position the two recording writers share.
portable-atomic = "1"
# Local time for recording file names.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The user's Videos folder for recordings.
dirs = "7"
# Free space on the disk audio tracks are written to, without unsafe code here.
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# O_NOFOLLOW, to open audio track files without following a link.
libc = "0.2"
# The volume serial number, file index and link count of an audio track file on Windows, without
# unsafe code here.
winapi-util = "0.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# contributors/people.toml, read by the engine's build script.
toml = "1"
# Speech models: the SHA-256 of each downloaded file.
sha2 = "0.10"
# Speech models: the spectrogram's frames on every core.
rayon = "1"
# Speech models: Whisper inference on the CPU, pure Rust.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
# Speech models: downloads over HTTPS with rustls and the system's certificate checks.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
# Tests only: temporary folders.
tempfile = "3"

# gpu (the wgpu eframe and egui-wgpu use)
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# media inputs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# Tests only: writes the subsampled four-component JPEGs the image source reads.
jpeg-encoder = "0.6"
# Tests only: random inputs for the readers and writers.
proptest = "1"
ab_glyph = "0.2"
# Audio devices: input capture, and output (loopback) capture on Windows.
cpal = "0.16"
# Capturing one application's audio, audio sessions and their peak meters on Windows.
wasapi = "0.27"
# Process names and parents, and the Windows build number, for application audio.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# Display and window capture.
xcap = "0.9"
# Audio devices on Linux, through the PipeWire sound server.
pipewire = "=0.10.1"
# The kernel's socket diagnostics on Linux, which tell which listening socket a socket file leads
# to, without unsafe code here.
rustix = { version = "1.1", default-features = false, features = ["std", "net"] }
# Cameras: Media Foundation on Windows, AVFoundation on macOS and V4L2 on Linux. Each system's
# backend is a feature, set in crates/platform.
nokhwa = { version = "=0.10.11", default-features = false }
# Reading a macOS camera's formats without changing its active format; the version nokhwa uses.
nokhwa-bindings-macos = "=0.2.4"
# COM set up on each Windows thread that uses Media Foundation.
comedy = "=0.2.0"
# Telling a Linux camera's picture nodes from its metadata nodes; the version nokhwa uses.
v4l = { version = "=0.14.0", default-features = false, features = ["v4l2"] }
# Camera frames sent as MJPEG.
zune-jpeg = "=0.5.15"
# Display and window capture on Linux, through the desktop's screen-cast portal.
ashpd = { version = "=0.14.0", default-features = false, features = ["async-io", "pipewire", "screencast"] }
# Ending a pending portal request when its capture is dropped.
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false }
# Listing the displays on Linux: Wayland's outputs, or RandR's monitors under X11. The versions winit uses.
wayland-client = "0.31"
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui-wgpu = "0.37"

# web (apps/studiocraft-web, wasm32 only): the page's elements and events, files the user picks,
# and downloads.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Shared Craft crates: storytold/craft-libs, MIT OR Apache-2.0, pinned to one rev.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", features = ["serde"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", features = ["egui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", features = ["egui"] }
craft-mcp = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-control-protocol = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-time = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-color = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
# White balance by temperature and tint for the color correction filter.
craft-color-transform = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
# Audio filter effects and the program loudness meter.
craft-audio-dsp = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
# Caption cues and the SubRip, WebVTT and plain-text files written beside a recording.
craft-captions = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }
# The Matroska writer for recordings, the Ogg reader for Ogg Vorbis media files, and in tests the demuxers that read
# back what the writers here produce.
craft-media ={ git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", default-features = false }
# Help › Check for Updates, the check at start and finishing an update the app installed itself.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", features = ["egui"] }
# Who draws the window frame (the desktop or the app), and the menu strip as the title bar.
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", features = ["egui"] }
# The built-in H.264 encoder (and its decoder, for tests), the AAC encoder and the Vorbis decoder.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", default-features = false, features = ["h264-encode", "threads"] }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd", default-features = false, features = ["aac-encode"] }
# The audio editor's session file, written for the audio tracks of a take.
craft-scraft-format = { git = "https://github.com/storytold/craft-libs", rev = "1c137fea600666d77eceabbfa3bdd0aef67d5fbd" }

# egui 0.37 and winit: the suite's forks (storytold/egui, storytold/winit), as craft-libs pins them.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# StudioCraft never crashes: shipped code returns `Result`/`Option` instead of panicking
# (AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "studiocraft"
description = "StudioCraft: an open-source recording and live-streaming studio (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "studiocraft"

[lints]
workspace = true

[dependencies]
studiocraft-engine = { workspace = true }
studiocraft-studio = { workspace = true }
studiocraft-render = { workspace = true }
studiocraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
egui = { workspace = true }
craft-keymap = { workspace = true }
craft-settings = { workspace = true }
craft-control-protocol = { workspace = true }
# Finishes an update when the app is started as the update helper.
craft-update = { workspace = true }
# Decides at start whether the app draws its own title bar.
craft-window = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The --screenshot picture.
image = { workspace = true }
base64 = { workspace = true }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Pixel and sample loops: keep debug builds real-time.
[profile.dev.package.studiocraft-render]
opt-level = 3

[profile.dev.package.studiocraft-media]
opt-level = 3

[profile.dev.package.studiocraft-sources]
opt-level = 3

[profile.dev.package.studiocraft-platform]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
